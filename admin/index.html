<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://pixora-bca1f.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Pixora Admin</title>
<style>
:root{--paper:#eceae4;--card:#fbfaf7;--ink:#17181a;--muted:#5f6266;--line:#d3d0c8;--bad:#bb3d29;--good:#1d7a5c;
  --spendlog:#2457c5;--splitlog:#5b36b8;--contour:#c2410c;--dashboard:#17181a;
  --body:-apple-system,system-ui,"Segoe UI",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root{--paper:#121314;--card:#1c1d1f;--ink:#ebeae6;--muted:#9c9fa3;--line:#323438;--bad:#f2907c;--good:#5ccaa2;--spendlog:#8fb0ff;--splitlog:#b9a2ff;--contour:#ffa877;--dashboard:#ebeae6;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:28px}h2{font-size:18px}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;color:inherit;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;display:inline-flex;align-items:center}
.btn.quiet{border-color:var(--line);font-weight:500}.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px}.seg button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{border-color:var(--ink);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border-radius:12px;padding:14px;border-top:4px solid var(--c,var(--ink))}
.tile .n{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.1}
.card{background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c,var(--ink))}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.chart i{flex:1;background:var(--c);min-height:1px;border-radius:2px 2px 0 0;opacity:.85}
.chart i.a{opacity:.35}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--ink)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:8px;background:var(--c);border-radius:2px;vertical-align:middle;margin-right:6px}
.err{color:var(--bad);font-weight:600}
.gate{max-width:420px;margin:12vh auto;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:12px}
input{width:100%;border:1px solid var(--line);background:var(--paper);color:inherit;border-radius:8px;padding:10px;min-height:44px;font-size:16px}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}@media (min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script src="../firebase-app-compat.js"></script>
<script src="../firebase-auth-compat.js"></script>
<script src="../firebase-firestore-compat.js"></script>
<script src="../cloud.js"></script>
<script src="admin.js"></script>
</body>
</html>
