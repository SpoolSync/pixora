<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://pixora-bca1f.firebaseapp.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixora Today">
<meta name="theme-color" content="#eceae4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<title>Pixora Today</title>
<style>
:root{
  --paper:#eceae4; --card:#fbfaf7; --ink:#17181a; --muted:#5f6266; --line:#d3d0c8;
  --accent:#17181a; --accent-ink:#fbfaf7;
  --good:#1d7a5c; --bad:#bb3d29; --warn:#9a6a00;
  --spend:#2457c5; --split:#5b36b8; --fit:#c2410c; --meal:#2f7d32; --inv:#0f766e; --leg:#6a3d7c;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --body:-apple-system,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#121314; --card:#1c1d1f; --ink:#ebeae6; --muted:#9c9fa3; --line:#323438;
    --accent:#ebeae6; --accent-ink:#121314;
    --good:#5ccaa2; --bad:#f2907c; --warn:#e6b54d;
    --spend:#8fb0ff; --split:#b9a2ff; --fit:#ffa877; --meal:#7ccf80; --inv:#5fd4c4; --leg:#d3a8e6;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:32px;font-weight:700;line-height:1.05}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:transparent;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn{color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.mini{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.back{all:unset;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--muted);padding:6px 0;min-height:32px}
.status{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:transparent;cursor:pointer;align-self:flex-start;min-height:32px}
.status.warn{color:var(--bad);border-color:var(--bad)}

/* attention list */
.attn{background:var(--card);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.attn .row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.attn .row:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transform:translateY(-1px)}
.attn .what{overflow-wrap:anywhere}
.attn .when{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}

/* app cards */
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}.card.wide{grid-column:1/-1}}
.card{background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--c,var(--ink))}
.card.spend{--c:var(--spend)} .card.split{--c:var(--split)} .card.fit{--c:var(--fit)} .card.meal{--c:var(--meal)} .card.inv{--c:var(--inv)} .card.leg{--c:var(--leg)}
.hide{display:flex;flex-direction:column;gap:8px;cursor:pointer;filter:blur(9px);transition:filter .2s;user-select:none}.hide.shown{filter:none}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chead h2{color:var(--c)}
.age{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.age.stale{color:var(--warn)}
.big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted)}
.ln{display:flex;align-items:baseline;gap:6px;font-size:14px}
.ln .lead{flex:1;border-bottom:1px dotted var(--line);transform:translateY(-3px);min-width:12px}
.ln .k{overflow-wrap:anywhere}
.ln .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.bar.over i{background:var(--bad)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.week span{height:8px;border-radius:2px;background:var(--line)}
.week span.on{background:var(--c)}

/* setup screens */
.intro{display:flex;flex-direction:column;background:var(--card);border-radius:12px;overflow:hidden}
.irow{display:flex;align-items:center;gap:12px;padding:14px 16px;color:inherit;text-decoration:none;border-top:1px solid var(--line);min-height:56px}
.irow:first-child{border-top:0}.irow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.itext{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.itext span{font-size:14px;color:var(--muted)}
.irow .go{font-size:13px;font-weight:600;color:var(--ink);flex:none}
.promise{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.promise li{display:flex;flex-direction:column;gap:2px;padding-left:14px;border-left:3px solid var(--ink);font-size:14px}.promise li span{color:var(--muted)}
.linkish{all:unset;cursor:pointer;font-weight:600;text-decoration:underline;color:var(--ink)}.linkish:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.gatecard{width:100%;max-width:420px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600}
input[type=email],input[type=password]{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;min-height:44px;font-size:16px}
.err{color:var(--bad);font-size:14px;font-weight:600}
.panel{background:var(--card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
[hidden]{display:none!important}
</style>
</head>
<body>
<section class="gate" id="gate" hidden><div class="gatecard" id="gateBody"></div></section>
<main class="wrap" id="app" hidden></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<script src="pixora-usage.js"></script>
<script src="app.js"></script>
</body>
</html>
